<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1b1f24;--muted:#5b6470;--line:#e2e5ea;--accent:#2457c5;--accent-soft:#e8eefb;
--ok:#1a7f37;--ok-soft:#e3f3e7;--warn:#9a6700;--warn-soft:#fff4d6;--bad:#c62828;--bad-soft:#fde7e7;--info:#4b5563;--info-soft:#eef0f3;
--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1216;--panel:#171b21;--ink:#e6e9ee;--muted:#9aa4b2;--line:#2a3038;
--accent:#7aa2ff;--accent-soft:#1c2638;--ok:#4cc26b;--ok-soft:#14281b;--warn:#e0b341;--warn-soft:#2c2412;--bad:#ff6b6b;--bad-soft:#331a1a;--info:#aab3bf;--info-soft:#20252c}}
:root[data-theme="dark"]{--bg:#0f1216;--panel:#171b21;--ink:#e6e9ee;--muted:#9aa4b2;--line:#2a3038;
--accent:#7aa2ff;--accent-soft:#1c2638;--ok:#4cc26b;--ok-soft:#14281b;--warn:#e0b341;--warn-soft:#2c2412;--bad:#ff6b6b;--bad-soft:#331a1a;--info:#aab3bf;--info-soft:#20252c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans)}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline}
header h1{font-size:20px;margin:0}
header .meta{color:var(--muted);font-size:13px}
header .meta b{color:var(--ink);font-weight:600}
nav{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);display:flex;overflow-x:auto;padding:0 12px}
nav button{border:0;background:none;color:var(--muted);padding:11px 12px;font:inherit;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
nav button .ct{font-size:11px;background:var(--info-soft);color:var(--muted);border-radius:9px;padding:1px 6px;margin-left:4px}
main{padding:18px 20px;max-width:1600px;margin:0 auto}
section.tab{display:none}section.tab.on{display:block}
h2{font-size:17px;margin:4px 0 4px}h3{font-size:14px;margin:18px 0 8px}
.lead{color:var(--muted);margin:0 0 14px;max-width:900px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.kpi .v{font-size:24px;font-weight:650}.kpi .l{color:var(--muted);font-size:12px}.kpi .s{font-size:12px;margin-top:2px}
.two{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.toolbar{display:flex;gap:8px;align-items:center;margin:0 0 8px;flex-wrap:wrap}
.toolbar input,.toolbar select{font:inherit;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);min-width:220px}
.toolbar .count{color:var(--muted);font-size:12px}
.tw{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;max-height:70vh}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);color:var(--muted);font-weight:600;cursor:pointer;user-select:none;z-index:1}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
td.wrap{white-space:normal;min-width:220px;max-width:460px}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--accent-soft)}
.mono{font-family:var(--mono);font-size:12px}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-warn{background:var(--warn-soft);color:var(--warn)}.p-info{background:var(--info-soft);color:var(--info)}
.muted{color:var(--muted)}.small{font-size:12px}
.chip{display:inline-block;border:1px solid var(--line);border-radius:5px;padding:0 6px;margin:1px 2px 1px 0;font-size:12px;background:var(--bg)}
.chip.link{cursor:pointer;color:var(--accent)}
#drawer{position:fixed;top:0;right:0;height:100vh;width:min(780px,100vw);background:var(--panel);border-left:1px solid var(--line);
box-shadow:-8px 0 24px rgba(0,0,0,.15);transform:translateX(105%);transition:transform .18s;z-index:20;display:flex;flex-direction:column}
#drawer.on{transform:none}
#drawer.max{width:100vw}
#drawer .grip{position:absolute;left:0;top:0;bottom:0;width:6px;cursor:col-resize}
#drawer .grip:hover{background:var(--accent-soft)}
#drawer button.x.mx{margin-right:0}
#drawer .hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
#drawer .hd h2{flex:1;margin:0;font-size:16px;word-break:break-all}
#drawer .bd{padding:6px 18px 30px;overflow:auto;flex:1}
#drawer button.x{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit}
dl.kv{display:grid;grid-template-columns:minmax(150px,max-content) 1fr;gap:3px 14px;margin:0}
dl.kv dt{color:var(--muted)}dl.kv dd{margin:0;word-break:break-word}
.raw td{white-space:normal;word-break:break-all}
.chain{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:4px 0 10px}
.node{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:150px;max-width:260px;font-size:12px}
.node .t{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.node .n{font-weight:600;font-size:13px;word-break:break-word}
.arrow{align-self:center;color:var(--muted);padding:0 6px;font-size:16px}
.hop{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:2px 6px;margin:2px;font-size:11px;background:var(--bg)}
.hop b{display:block;font-size:12px}
.sev-critical{border-left:4px solid var(--bad)}.sev-warning{border-left:4px solid var(--warn)}.sev-info{border-left:4px solid var(--line)}
.bar{height:8px;border-radius:4px;background:var(--info-soft);overflow:hidden;min-width:60px}.bar>i{display:block;height:100%;background:var(--accent)}
svg text{fill:var(--ink);font-family:var(--sans)}
.legend span{margin-right:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.foot{color:var(--muted);font-size:12px;margin-top:18px}
button.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:5px 10px;border-radius:6px;cursor:pointer}
@media (max-width:700px){main{padding:12px}.two{grid-template-columns:1fr}header{padding:12px}}

/* ---- glass look: translucent panels over a soft colour field ---- */
:root{--glass:rgba(255,255,255,.58);--glass-strong:rgba(255,255,255,.80);--glass-line:rgba(255,255,255,.75);
  --glow:0 10px 30px rgba(36,87,197,.12);--grad:linear-gradient(135deg,#2457c5 0%,#7c5cff 55%,#14b8a6 100%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass:rgba(23,27,33,.55);--glass-strong:rgba(23,27,33,.82);
  --glass-line:rgba(255,255,255,.09);--glow:0 10px 30px rgba(122,162,255,.14);--grad:linear-gradient(135deg,#7aa2ff 0%,#b59cff 55%,#5eead4 100%)}}
:root[data-theme="dark"]{--glass:rgba(23,27,33,.55);--glass-strong:rgba(23,27,33,.82);--glass-line:rgba(255,255,255,.09);
  --glow:0 10px 30px rgba(122,162,255,.14);--grad:linear-gradient(135deg,#7aa2ff 0%,#b59cff 55%,#5eead4 100%)}
body{min-height:100vh;background:
  radial-gradient(1100px 560px at 8% -12%,rgba(124,92,255,.24),transparent 62%),
  radial-gradient(900px 520px at 96% -4%,rgba(20,184,166,.20),transparent 60%),
  radial-gradient(900px 620px at 52% 115%,rgba(36,87,197,.20),transparent 60%),
  var(--bg);background-attachment:fixed}
header,nav{background:var(--glass-strong);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
  border-bottom:1px solid var(--glass-line);box-shadow:0 8px 30px rgba(0,0,0,.06)}
header h1{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:750;letter-spacing:-.01em}
nav button{border-radius:10px 10px 0 0;transition:background .15s,color .15s}
nav button:hover{background:rgba(124,92,255,.08);color:var(--ink)}
nav button.on{background:linear-gradient(180deg,rgba(124,92,255,.16),transparent 90%)}
h2{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.card,.tw{background:var(--glass);
  border:1px solid var(--glass-line);box-shadow:var(--glow),0 1px 0 rgba(255,255,255,.35) inset;border-radius:14px}
.card{transition:transform .18s ease,box-shadow .18s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(36,87,197,.18),0 1px 0 rgba(255,255,255,.4) inset}
.kpi .v{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:28px}
th{background:var(--glass-strong)}
tbody tr:hover{background:rgba(124,92,255,.08)}
.pill{border:1px solid rgba(255,255,255,.45);backdrop-filter:blur(4px);box-shadow:0 2px 8px rgba(0,0,0,.05)}
.p-ok{box-shadow:0 0 0 3px rgba(26,127,55,.08),0 2px 8px rgba(26,127,55,.15)}
.p-bad{box-shadow:0 0 0 3px rgba(198,40,40,.08),0 2px 10px rgba(198,40,40,.22)}
.chip{background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:8px;border-color:var(--glass-line)}
.chip.link:hover{background:rgba(124,92,255,.14);box-shadow:0 4px 12px rgba(124,92,255,.2)}
.node,.hop{background:var(--glass);backdrop-filter:blur(10px);border-radius:12px;border-color:var(--glass-line)}
.toolbar input,.toolbar select,button.btn,#drawer button.x{background:var(--glass-strong);backdrop-filter:blur(8px);border-radius:10px;border-color:var(--glass-line)}
button.btn:hover,#drawer button.x:hover{box-shadow:0 4px 14px rgba(36,87,197,.22)}
#drawer{background:var(--glass-strong);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);
  border-left:1px solid var(--glass-line);box-shadow:-18px 0 50px rgba(0,0,0,.18)}
#drawer .hd{background:transparent}
.sev-critical{border-left-width:5px}
main section.tab.on{animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.tw::-webkit-scrollbar,#drawer .bd::-webkit-scrollbar{width:10px;height:10px}
.tw::-webkit-scrollbar-thumb,#drawer .bd::-webkit-scrollbar-thumb{background:rgba(124,92,255,.35);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
@media (prefers-reduced-motion:reduce){main section.tab.on,.card{animation:none;transition:none}}

/* ---- fancy layer: moving colour aura, gradient-edged cards, glowing tabs, status pulses ---- */
body{position:relative}
body::before{content:"";position:fixed;left:-30%;top:-30%;width:160%;height:160%;z-index:-1;pointer-events:none;
  background:conic-gradient(from 0deg,rgba(124,92,255,.22),rgba(20,184,166,.18),rgba(36,87,197,.20),rgba(244,114,182,.12),rgba(124,92,255,.22));
  filter:blur(80px);opacity:.85}
@keyframes aurora{to{transform:rotate(360deg)}}
main{position:relative;z-index:1}
.card{position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;opacity:.45;transition:opacity .25s;
  background:linear-gradient(135deg,rgba(124,92,255,.9),rgba(20,184,166,.6),rgba(36,87,197,.1));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.card:hover::before{opacity:1}
.kpi .v{text-shadow:0 0 28px rgba(124,92,255,.28)}
nav button{position:relative;font-weight:500}
nav button.on{border-bottom-color:transparent}
nav button.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;border-radius:3px;background:var(--grad);box-shadow:0 0 14px rgba(124,92,255,.65)}
th{text-transform:uppercase;letter-spacing:.03em;font-size:11px}
tbody tr:nth-child(even){background:rgba(127,127,160,.045)}
tbody tr:hover{background:rgba(124,92,255,.12)}
.pill::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px;box-shadow:0 0 8px currentColor}
.p-bad::before{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
h3{letter-spacing:.01em}
.kpi.link{cursor:pointer}.kpi.link:hover{box-shadow:0 16px 40px rgba(124,92,255,.22),0 1px 0 rgba(255,255,255,.4) inset}
.kpis>*{animation:fadeUp .45s ease both}
.kpis>*:nth-child(2){animation-delay:.05s}.kpis>*:nth-child(3){animation-delay:.1s}.kpis>*:nth-child(4){animation-delay:.15s}
.kpis>*:nth-child(5){animation-delay:.2s}.kpis>*:nth-child(6){animation-delay:.25s}.kpis>*:nth-child(7){animation-delay:.3s}
.kpis>*:nth-child(8){animation-delay:.35s}.kpis>*:nth-child(9){animation-delay:.4s}.kpis>*:nth-child(10){animation-delay:.45s}
@media (prefers-reduced-motion:reduce){body::before,.p-bad::before,.kpis>*{animation:none}}

/* ---- table headers: heavier, different face, highlighted band ---- */
th{font-family:"Segoe UI Variable","Segoe UI",var(--sans);font-weight:750;font-size:11.5px;letter-spacing:.07em;color:var(--ink);
  background:linear-gradient(180deg,rgba(124,92,255,.20),rgba(20,184,166,.07)) , var(--glass-strong);
  border-bottom:2px solid rgba(124,92,255,.5);padding:9px 10px}
th:hover{color:var(--accent)}

/* ---- scroll bars: wider, rounded, gradient thumb ---- */
html{scrollbar-width:auto;scrollbar-color:rgba(124,92,255,.55) transparent}
::-webkit-scrollbar{width:14px;height:14px}
::-webkit-scrollbar-track{background:var(--glass);border-radius:10px}
::-webkit-scrollbar-thumb{background:var(--grad);border-radius:10px;border:3px solid transparent;background-clip:padding-box;min-height:40px}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(135deg,#7c5cff,#14b8a6);background-clip:padding-box}
::-webkit-scrollbar-corner{background:transparent}
/*__E2E_CSS__*/
</style>
</head>
<body>
<header>
  <h1 id="h-name"></h1>
  <div class="meta" id="h-meta"></div>
  <div style="flex:1"></div>
  <button class="btn" id="theme">Theme</button>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<aside id="drawer"><div class="grip" id="d-grip" title="Drag to resize"></div><div class="hd"><h2 id="d-title"></h2><button class="x mx" id="d-max" title="Maximize / restore">Maximize</button><button class="x" id="d-close">Close</button></div><div class="bd" id="d-body"></div></aside>

<script>
/*__E2E_JS__*/
const D = __DATA__;
const M = D.model, SRC = D.src;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const fmtN = v => v == null || v === "" ? "" : (typeof v === "number" ? v.toLocaleString() : esc(v));
function fmtB(v){ if(v==null) return ""; const u=["B","KB","MB","GB","TB","PB"]; let i=0, x=+v; while(x>=1000&&i<u.length-1){x/=1000;i++} return (i?x.toFixed(x<10?2:1):x)+" "+u[i]; }
function fmtDur(s){ if(s==null) return ""; s=+s; const d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60); return d?`${d}d ${h}h`:h?`${h}h ${m}m`:`${m}m`; }
function fmtRate(m){ if(m==null) return ""; return m>=1000?(m/1000).toFixed(2)+" Gb/s":m>=1?m.toFixed(1)+" Mb/s":(m*1000).toFixed(0)+" kb/s"; }
function pill(v){ const s=String(v??""); if(!s) return '<span class="muted">—</span>';
  const c = /^(up|ok|alive|active|true|success|consistent|authorized)$/i.test(s)?"p-ok":/down|alarm|fail|false|dead|not-active/i.test(s)?"p-bad":/warn|link-up/i.test(s)?"p-warn":"p-info";
  return `<span class="pill ${c}">${esc(s)}</span>`; }
function sevPill(s){ return `<span class="pill ${s==="critical"?"p-bad":s==="warning"?"p-warn":"p-info"}">${s}</span>`; }
const EXPLAIN = {
  sap: {title: "Busiest SAPs: how it is calculated", html: `<p>Each bar is the average traffic of one SAP since its counters were last cleared:</p>
    <p class="mono" style="padding:8px 10px;background:var(--glass);border-radius:8px">(received + transmitted octets) × 8 ÷ seconds since clear, shown in Mb/s</p>
    <ul><li>Received: valid octets on the ingress forwarding engine (<span class="mono">received-valid-octets</span>).</li>
    <li>Transmitted: aggregate forwarded octets on the egress traffic manager (<span class="mono">aggregate-forwarded-octets</span>).</li>
    <li>Seconds since clear: from the SAP's <span class="mono">last-cleared-time</span> to the newest timestamp in the data, not to the current clock.</li></ul>
    <p class="small muted">The counters only go up, so this is an average since the last clear, not the rate right now. Use the port bars for the recent 5-minute load.</p>`},
  port: {title: "Busiest ports: how it is calculated", html: `<p>Each bar is the port's 5-minute utilisation as reported by the router: <span class="mono">in-utilization</span> and <span class="mono">out-utilization</span>, in hundredths of a percent. The bar shows the higher of the two.</p>
    <p>Ports at 70% or more raise a capacity warning under Issues.</p>
    <p class="small muted">The router calculates these values itself, so they reflect the last 5 minutes, not an average since the last clear.</p>`},
  lsp: {title: "Where PCEP-reported LSPs leave: how it is calculated", html: `<p>Each bar counts the PCEP LSPs whose first ERO hop is that router interface. The first hop is the router's own outgoing link, so this shows where the LSPs leave the box.</p>
    <p class="small muted">It uses the PCEP export. Without it, this card shows "PCEP export not loaded".</p>`},
  health: {title: "Health score: how it is calculated", html: `<p>The score starts at 100. It loses 10 points for each critical finding and 2 points for each warning, using the newest stored run of every query.</p>
    <p>Verdicts: 90 and above is Healthy, 70 to 89 needs attention, below 70 needs action.</p>
    <p class="small muted">Findings for intentional admin shutdowns are not excluded yet, so the score can be lower than the real state.</p>`}
};
document.addEventListener("click", e => { const tb = e.target.closest("[data-tab]"); if (tb) { switchTab(tb.dataset.tab); window.scrollTo({top: 0, behavior: "smooth"}); } });
function explain(key){ return ` <span class="chip link" data-explain="${key}">How is this calculated?</span>`; }
document.addEventListener("click", e => { const x = e.target.closest("[data-explain]"); if (x){ e.stopPropagation(); const t = EXPLAIN[x.dataset.explain]; openDrawer(t.title, `<div class="explain">${t.html}</div>`); } });
function chip(t, onclick){ return `<span class="chip${onclick?" link":""}" ${onclick?`data-go="${esc(onclick)}"`:""}>${esc(t)}</span>`; }
function resolve(ref){ if(!ref) return null; let o = SRC[ref[0]]; for(const k of ref[1]){ if(o==null) return null; o = o[k]; } return o; }
function flatten(o, p = "", out = []){ if(o && typeof o === "object"){ if(Array.isArray(o)) o.forEach((v,i)=>flatten(v,`${p}[${i}]`,out)); else for(const k in o) flatten(o[k], p?`${p}/${k}`:k, out);} else out.push([p,o]); return out; }

/* ---------- lookups ---------- */
const portById = Object.fromEntries(M.ports.map(p => [p.id, p]));
const svcKey = s => `${s.type}:${s.id}`;
const svcByKey = Object.fromEntries(M.services.map(s => [svcKey(s), s]));
const sdpById = Object.fromEntries(M.sdps.map(s => [String(s.id), s]));
const lspByName = Object.fromEntries(M.lsps.map(l => [l.name, l]));
const custById = Object.fromEntries(M.customers.map(c => [String(c.id), c]));

/* ---------- drawer ---------- */
function kv(obj){ return `<dl class="kv">${Object.entries(obj).filter(([,v])=>v!==undefined&&v!==null&&v!=="").map(([k,v])=>`<dt>${esc(k)}</dt><dd>${v}</dd>`).join("")}</dl>`; }
function rawSection(title, ref){
  const o = resolve(ref); if(o==null) return "";
  const rows = flatten(o); const id = "r"+Math.random().toString(36).slice(2);
  return `<h3>${esc(title)} <span class="muted small">(${rows.length} fields, ${esc(ref[0])})</span></h3>
  <div class="toolbar"><input placeholder="Filter fields" oninput="filterRaw('${id}',this.value)"></div>
  <div class="tw" style="max-height:none"><table class="raw" id="${id}"><tbody>${rows.map(([k,v])=>`<tr><td class="mono muted">${esc(k)}</td><td class="mono">${esc(v)}</td></tr>`).join("")}</tbody></table></div>`;
}
window.filterRaw = (id, q) => { q=q.toLowerCase(); document.querySelectorAll(`#${id} tr`).forEach(tr => tr.style.display = tr.textContent.toLowerCase().includes(q) ? "" : "none"); };
function openDrawer(title, html){ $("#d-title").textContent = title; $("#d-body").innerHTML = html; $("#drawer").classList.add("on"); $("#d-body").scrollTop = 0; }
$("#d-close").onclick = () => $("#drawer").classList.remove("on");
$("#d-max").onclick = () => { const d = $("#drawer"); d.style.width = ""; d.classList.toggle("max"); $("#d-max").textContent = d.classList.contains("max") ? "Restore" : "Maximize"; };
(function(){
  const d = $("#drawer"), grip = $("#d-grip"); let dragging = false;
  grip.addEventListener("pointerdown", e => { dragging = true; grip.setPointerCapture(e.pointerId); e.preventDefault(); });
  grip.addEventListener("pointermove", e => {
    if(!dragging) return;
    const w = Math.max(360, Math.min(window.innerWidth - e.clientX, window.innerWidth));
    d.classList.remove("max"); $("#d-max").textContent = "Maximize"; d.style.width = w + "px";
  });
  grip.addEventListener("pointerup", () => { dragging = false; });
})();
document.addEventListener("keydown", e => { if(e.key==="Escape") $("#drawer").classList.remove("on"); });
document.addEventListener("click", e => { const g = e.target.closest("[data-go]"); if(g){ e.stopPropagation(); go(g.dataset.go); } });
function go(ref){ const [k, ...rest] = ref.split("|"); const v = rest.join("|");
  if(k==="port" && portById[v]) showPort(portById[v]);
  else if(k==="svc" && svcByKey[v]) showService(svcByKey[v]);
  else if(k==="sdp" && sdpById[v]) showSdp(sdpById[v]);
  else if(k==="lsp" && lspByName[v]) showLsp(lspByName[v]);
  else if(k==="cust" && custById[v]) showCustomer(custById[v]);
  else if(k==="trace" && svcByKey[v]){ switchTab("trace"); $("#trace-sel").value = v; renderTrace(); $("#drawer").classList.remove("on"); }
  else if(k==="nbr"){ const n = M.neighbors.find(x=>x.name===v); if(n) showNeighbor(n); }
  else if(k==="tab"){ switchTab(v); window.scrollTo(0, 0); }
}

/* ---------- table ---------- */
function table(el, cols, rows, onRow, opts = {}){
  let sortK = opts.sort || null, dir = opts.dir || 1, q = "";
  el.innerHTML = `<div class="toolbar"><input placeholder="Search ${opts.what||""}"><span class="count"></span>${opts.extra||""}</div><div class="tw"><table><thead><tr>${cols.map((c,i)=>`<th data-i="${i}" class="${c.num?"num":""}" title="${esc(c.tip||"")}">${esc(c.l)}</th>`).join("")}</tr></thead><tbody></tbody></table></div>`;
  const tb = $("tbody", el), inp = $("input", el), cnt = $(".count", el);
  const val = (r, c) => typeof c.v === "function" ? c.v(r) : r[c.k];
  function draw(){
    let rs = rows.filter(r => !q || cols.some(c => String(val(r,c) ?? "").toLowerCase().includes(q)) || (opts.searchExtra && opts.searchExtra(r).toLowerCase().includes(q)));
    if(sortK != null){ const c = cols[sortK]; rs = rs.slice().sort((a,b)=>{ const x=val(a,c), y=val(b,c); return (typeof x==="number"&&typeof y==="number"? x-y : String(x??"").localeCompare(String(y??""), undefined, {numeric:true})) * dir; }); }
    cnt.textContent = `${rs.length} of ${rows.length}`;
    tb.innerHTML = rs.map((r,i)=>`<tr data-i="${rows.indexOf(r)}">${cols.map(c=>`<td class="${c.num?"num":""} ${c.cls||""}">${c.f?c.f(r):fmtN(val(r,c))}</td>`).join("")}</tr>`).join("");
  }
  inp.oninput = () => { q = inp.value.toLowerCase(); draw(); };
  $("thead", el).onclick = e => { const th = e.target.closest("th"); if(!th) return; const i=+th.dataset.i; dir = sortK===i ? -dir : (cols[i].num?-1:1); sortK = i; draw(); };
  tb.onclick = e => { if(e.target.closest("[data-go]")) return; const tr = e.target.closest("tr"); if(tr && onRow) onRow(rows[+tr.dataset.i]); };
  draw();
  return { setQuery(v){ inp.value=v; q=v.toLowerCase(); draw(); } };
}

function drawTopo(el){
  const core = M.neighbors.filter(n=>n.kind==="Nokia 7750 SR"), edge = M.neighbors.filter(n=>n.kind!=="Nokia 7750 SR");
  const W = 640, H = 420, cx = W/2, cy = 205;
  const place = (arr, a0, a1, r) => arr.map((n,i)=>{ const a = arr.length===1?(a0+a1)/2:a0+(a1-a0)*i/(arr.length-1); return {n, x: cx + r*Math.cos(a), y: cy + r*Math.sin(a)}; });
  const pts = [...place(core, -Math.PI*0.85, -Math.PI*0.15, 165), ...place(edge, Math.PI*0.08, Math.PI*0.92, 175)];
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="LLDP topology">`;
  for(const p of pts){ const down = p.n.links.every(k=>k.oper!=="up"); const lbl = [...new Set(p.n.links.map(k=>k.lag||k.localPort))].join(", ");
    s += `<line x1="${cx}" y1="${cy}" x2="${p.x}" y2="${p.y}" stroke="${down?"var(--bad)":"var(--line)"}" stroke-width="${p.n.kind==="Nokia 7750 SR"?3:1.5}"/>`;
    const mx = cx+(p.x-cx)*0.55, my = cy+(p.y-cy)*0.55; s += `<text x="${mx}" y="${my}" font-size="10" text-anchor="middle" style="fill:var(--muted)">${esc(lbl)}</text>`; }
  s += `<rect x="${cx-70}" y="${cy-18}" width="140" height="36" rx="6" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="13" font-weight="700">${esc(dev.name)}</text>`;
  for(const p of pts){ const c = p.n.kind==="Nokia 7750 SR"?"var(--accent)":"var(--warn)";
    s += `<g data-go="nbr|${esc(p.n.name)}" style="cursor:pointer"><circle cx="${p.x}" cy="${p.y}" r="7" fill="${c}"/><text x="${p.x}" y="${p.y + (p.y<cy?-12:20)}" text-anchor="middle" font-size="11" font-weight="600">${esc(p.n.name)}</text><text x="${p.x}" y="${p.y + (p.y<cy?-24:32)}" text-anchor="middle" font-size="9" style="fill:var(--muted)">${esc(p.n.kind)}</text></g>`; }
  el.innerHTML = s + "</svg>";
}

function renderTrace(){
  const s = svcByKey[$("#trace-sel").value]; if(!s) return; const c = custById[String(s.customer)];
  let h = "";
  const cust = node("Customer", esc(c?c.description||c.id:s.customer), c?`<div class="muted">${esc(c.contact||"")} ${esc(c.phone||"")}</div>`:"", c?"cust|"+c.id:null);
  const svc = node(s.type.toUpperCase()+" "+s.id, esc(s.name), `<div>${pill(s.oper)} MTU ${esc(s.mtu)}</div><div class="muted">${s.saps.length} SAP · ${s.binds.length} SDP binding</div>`, "svc|"+svcKey(s));
  const sapNodes = s.saps.length ? s.saps.map(x=>{ const p = portById[x.port]; const far = p ? (p.neighbors.map(n=>`${n.systemName} ${n.remotePortId}`).join(", ") || p.elmi.uniId) : "";
    return node("SAP", `<span class="mono">${esc(x.sapId)}</span>`, `<div>${pill(x.oper)} port ${pill(p?.oper)}</div><div class="muted">${p?.optic?.vendorPart?esc(p.optic.vendorPart)+" · ":""}${p?.ddm["received-optical-power"]?`Rx ${p.ddm["received-optical-power"].current} dBm`:""}</div><div class="small">${esc(far)}</div><div class="muted">${fmtRate(x.rxAvgMbps)} in · ${fmtRate(x.txAvgMbps)} out</div>`, "port|"+x.port); }).join("") : node("SAP","none","");
  h += `<h3>Access side</h3><div class="chain">${cust}<span class="arrow">→</span><div style="display:flex;flex-direction:column;gap:6px">${sapNodes}</div><span class="arrow">→</span>${svc}</div>`;
  if(s.interfaces.length) h += `<h3>Routed interfaces</h3>` + s.interfaces.map(i=>`<div class="chain">${svc}<span class="arrow">→</span>${node("Interface",esc(i.name),`<div class="mono">${esc(i.address)}</div><div class="muted">VPLS ${esc(i.vplsBinding||"")}</div>`, i.vplsBinding&&M.services.find(v=>v.name===i.vplsBinding)?"svc|vpls:"+M.services.find(v=>v.name===i.vplsBinding).id:null)}</div>`).join("");
  if((s.routedBy||[]).length) h += `<p>Routed by ${s.routedBy.map(r=>chip(`vprn ${r.vprn} ${r.address}`,"svc|vprn:"+r.vprn)).join(" ")}</p>`;

    for(const b of s.binds){ const sd = sdpById[String(b.sdpId)], l = sd && lspByName[sd.lspName];
      h += `<div class="chain">${node(b.kind+" binding", `<span class="mono">${esc(b.bindId)}</span>`, `<div>${pill(b.oper)}</div><div class="muted">${fmtB(b.inOctets)} in · ${fmtB(b.outOctets)} out</div>`)}<span class="arrow">→</span>` +
        (sd ? node("SDP "+sd.id, esc(sd.farEndName||sd.farEnd), `<div>${pill(sd.oper)} keep-alive ${pill(sd.kaOper)}</div><div class="mono muted">${esc(sd.farEnd)}</div>`, "sdp|"+sd.id) : node("SDP", esc(b.sdpId), '<div class="muted">not in SDP data</div>')) +
        (l ? `<span class="arrow">→</span>${node("LSP", esc(l.name), `<div>${pill(l.oper)} metric ${esc(l.metric)}</div><div class="muted">${l.egressLag?("via "+esc(l.egressLag)):""} ${fmtN(l.transitions)} transitions</div>`, "lsp|"+l.name)}<span class="arrow">→</span><div class="node" style="max-width:none"><div class="t">Signalled path (PCEP ERO)</div>${eroHtml(l)}</div>` : sd&&sd.lspName ? `<span class="arrow">→</span>${node("LSP", esc(sd.lspName), '<div class="muted">not in LSP state</div>')}` : "") + `</div>`; } }
  else if(s.type!=="vprn") h += `<p class="muted">No SDP bindings: the service is local to this router.</p>`;

    <p class="small muted">Full list of services with their far ends: <span class="chip link" data-go="tab|e2e">End-to-end services</span></p>`;
  $("#trace-out").innerHTML = h;
}

R.raw = el => {
  const keys = Object.keys(SRC);
  el.innerHTML = `<h2>All raw data</h2><p class="lead">Every field returned by every response, flattened to path and value. Use this to check anything the other tabs summarise.</p><div class="toolbar"><select id="rs">${keys.map(k=>`<option value="${k}">${esc((M.sources.find(s=>s.key===k)||{}).label||k)}</option>`).join("")}</select><input id="rq" placeholder="Filter path or value (min 2 chars)"><span class="count" id="rc"></span></div><div class="tw"><table class="raw"><tbody id="rb"></tbody></table></div>`;
  const draw = () => { const rows = flatten(SRC[$("#rs",el).value]); const q = $("#rq",el).value.toLowerCase(); const f = q.length>1 ? rows.filter(([k,v])=>(k+" "+v).toLowerCase().includes(q)) : rows;
    $("#rc",el).textContent = `${f.length.toLocaleString()} of ${rows.length.toLocaleString()} fields${f.length>3000?" (showing first 3,000)":""}`;
    $("#rb",el).innerHTML = f.slice(0,3000).map(([k,v])=>`<tr><td class="mono muted">${esc(k)}</td><td class="mono">${esc(v)}</td></tr>`).join(""); };
  $("#rs",el).onchange = draw; $("#rq",el).oninput = draw; draw();
};

$("#theme").onclick = () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark ? "light" : "dark"; };
let start = "overview"; try{ start = localStorage.getItem("devrep-tab") || start; }catch(e){}
if(!R[start]) start = "overview";
switchTab(start);
</script>
</body>
</html>
